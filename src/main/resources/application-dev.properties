# Opt-in demonstration data. The file is deliberately NOT src/main/resources/data.sql:
# with spring.sql.init.mode=embedded Spring Boot would run a classpath-root data.sql
# under every profile, including the tests', which count rows and assert what a
# queue does not contain. Naming it here means only this profile loads it.
spring.sql.init.data-locations=classpath:seed/data.sql
