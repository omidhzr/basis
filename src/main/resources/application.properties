spring.application.name=basis

# In-memory only. DB_CLOSE_DELAY keeps the database alive between connections
# for the lifetime of the JVM; without it H2 discards it when the pool closes
# its last connection.
spring.datasource.url=jdbc:h2:mem:basis;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# schema.sql runs automatically for an embedded datasource.
spring.sql.init.mode=embedded

springdoc.swagger-ui.path=/swagger-ui.html

# A field the endpoint does not document is rejected rather than ignored, so
# that an attempt to change something immutable fails loudly instead of
# appearing to succeed.
spring.jackson.deserialization.fail-on-unknown-properties=true
