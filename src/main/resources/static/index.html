<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basis</title>
<!-- An empty inline icon, so the browser does not ask the service for a favicon it lacks. -->
<link rel="icon" href="data:,">
<!-- Vendored, not loaded from a CDN: the page must render with no network. -->
<link rel="stylesheet" href="vendor/pico.classless.min.css">
</head>
<body>

<header>
  <h1>Basis</h1>
  <nav>
    <ul>
      <li><a href="#" id="to-queue">Queue</a></li>
      <li><a href="#new">New request</a></li>
    </ul>
  </nav>

  <!-- Stands in for the claims a JWT would carry. Switching it is how the
       workflow is demonstrated: the queue changes, not just the buttons. -->
  <form id="identity" novalidate>
    <fieldset role="group">
      <input id="user-id" list="known-users" aria-label="User identifier" autocomplete="off">
      <select id="role" aria-label="Role">
        <option value="RELATIONSHIP_MANAGER">RELATIONSHIP_MANAGER</option>
        <option value="REVIEWER">REVIEWER</option>
      </select>
    </fieldset>
    <datalist id="known-users">
      <option value="rm-1"></option>
      <option value="rm-2"></option>
      <option value="reviewer-1"></option>
      <option value="reviewer-2"></option>
    </datalist>
  </form>
</header>

<main>
  <div id="notice" role="alert"></div>

  <section id="queue" hidden>
    <h2>Queue</h2>
  </section>

  <section id="detail" hidden>
  </section>

  <section id="create" hidden>
    <h2>New request</h2>
  </section>
</main>

<script>
'use strict';

// This page is a thin client over the JSON API. It holds no business rule the
// API does not also enforce: every bound, every transition and every refusal
// comes from the service, and what the service says is what is shown.

// Builds an element from data without any path that parses markup. Every value
// a user wrote -- a reason, a note, an identity -- reaches the page through a
// text node, so none of it can become script.
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [name, value] of Object.entries(attrs || {})) {
    if (name.startsWith('on')) node.addEventListener(name.slice(2), value);
    else if (value === true) node.setAttribute(name, '');
    else if (value !== false && value != null) node.setAttribute(name, value);
  }
  for (const child of children.flat()) {
    node.append(child instanceof Node ? child : String(child ?? ''));
  }
  return node;
}

// Identity is a stand-in for the claims a JWT would carry; nothing verifies it.
// It travels as headers on every call, from one place, so no call can forget it.
// Kept per tab, not per browser, so two tabs can be two different people -- which
// is how a stale decision is shown to someone -- and tolerant of storage being
// refused, in which case the default is simply not remembered.
const DEFAULT_IDENTITY = { id: 'rm-1', role: 'RELATIONSHIP_MANAGER' };

function loadIdentity() {
  try {
    const stored = JSON.parse(sessionStorage.getItem('identity'));
    if (stored && typeof stored.id === 'string' && ['RELATIONSHIP_MANAGER', 'REVIEWER'].includes(stored.role)) {
      return stored;
    }
  } catch { /* storage refused or unreadable: fall through to the default */ }
  return { ...DEFAULT_IDENTITY };
}

function saveIdentity() {
  try { sessionStorage.setItem('identity', JSON.stringify(identity)); } catch { /* not remembered */ }
}

let identity = loadIdentity();

// Never throws: a call that fails before any response exists comes back with
// status 0 and the browser's own message, since there is no problem detail to
// show and inventing wording is what this page must not do.
async function call(method, path, body, extraHeaders) {
  const headers = { 'X-User-Id': identity.id, 'X-User-Role': identity.role, ...extraHeaders };
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  try {
    const response = await fetch(path, {
      method,
      headers,
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    const text = await response.text();
    let parsed = null;
    try { parsed = text ? JSON.parse(text) : null; } catch { /* not JSON */ }
    return { ok: response.ok, status: response.status, statusText: response.statusText, body: parsed };
  } catch (failure) {
    return { ok: false, status: 0, failure: failure.message };
  }
}

const notice = document.getElementById('notice');

function clearNotice() {
  notice.replaceChildren();
}

// The one place a refusal is rendered: the service's title and detail, as sent.
function showProblem(result) {
  if (result.failure !== undefined) {
    notice.replaceChildren(el('article', {}, el('p', {}, result.failure)));
    return;
  }
  const problem = result.body;
  if (problem && (problem.title || problem.detail)) {
    notice.replaceChildren(el('article', {},
      el('h3', {}, problem.title),
      el('p', {}, problem.detail),
      el('small', {}, 'HTTP ' + result.status)));
  } else {
    notice.replaceChildren(el('article', {}, el('p', {}, result.status + ' ' + result.statusText)));
  }
}

// One section is shown at a time, toggled by state rather than routed.
function show(name) {
  for (const id of ['queue', 'detail', 'create']) {
    document.getElementById(id).hidden = id !== name;
  }
}

// Instants arrive as UTC ISO-8601. Reformatting the string, rather than building
// a Date, keeps the page from converting to the viewer's zone, which would make
// one history read differently on two machines.
function fmtTime(instant) {
  return instant ? instant.slice(0, 10) + ' ' + instant.slice(11, 16) + ' UTC' : '';
}

// Whole hundredths, not floating-point division: the stored value is an integer
// and its rendering should not be a float either.
function fmtDiscount(bps) {
  return bps + ' bp (' + Math.floor(bps / 100) + '.' + String(bps % 100).padStart(2, '0') + ' percentage points)';
}

// A navigation that has been overtaken -- the identity switched, a link followed
// -- must not paint over the one that replaced it when its response arrives late.
let navigation = 0;

async function showQueue() {
  const mine = ++navigation;
  show('queue');
  const result = await call('GET', '/requests');
  if (mine !== navigation) return;
  const section = document.getElementById('queue');
  const heading = section.querySelector('h2');
  if (!result.ok) {
    showProblem(result);
    section.replaceChildren(heading);
    return;
  }
  section.replaceChildren(heading, queueTable(result.body));
}

function queueTable(rows) {
  if (rows.length === 0) return el('p', {}, 'Nothing to show.');
  const columns = ['Application', 'Discount', 'Reason', 'Requested by', 'Status', 'Submitted', 'Version'];
  return el('table', {},
    el('thead', {}, el('tr', {}, columns.map((name) => el('th', { scope: 'col' }, name)))),
    el('tbody', {}, rows.map((row) => el('tr', {},
      el('td', {}, el('a', { href: '#' + row.id }, row.applicationId)),
      el('td', {}, fmtDiscount(row.discountBps)),
      el('td', {}, row.reason),
      el('td', {}, row.requestedBy),
      el('td', {}, row.status),
      el('td', {}, fmtTime(row.createdAt)),
      el('td', {}, row.version)))));
}

// The request on show, exactly as the service returned it. Every action reads
// its version from here, so what is submitted is what was displayed.
let shown = null;

const backToQueue = () => el('p', {}, el('a', { href: '#' }, '← Queue'));

async function showDetail(id) {
  const mine = ++navigation;
  show('detail');
  const section = document.getElementById('detail');
  const result = await call('GET', '/requests/' + encodeURIComponent(id));
  if (mine !== navigation) return;
  if (!result.ok) {
    shown = null;
    showProblem(result);
    section.replaceChildren(backToQueue());
    return;
  }
  shown = result.body;
  section.replaceChildren(...detailView(shown));
}

function detailView({ request, history }) {
  const facts = [
    ['Status', request.status],
    ['Discount', fmtDiscount(request.discountBps)],
    ['Reason', request.reason],
    ['Requested by', request.requestedBy],
    ['Version', request.version],
    ['Submitted', fmtTime(request.createdAt)],
    ['Last updated', fmtTime(request.updatedAt)],
  ];
  if (request.decidedBy) {
    facts.push(['Decided by', request.decidedBy], ['Decided at', fmtTime(request.decidedAt)]);
  }
  return [
    backToQueue(),
    el('h2', {}, request.applicationId),
    el('dl', {}, facts.flatMap(([name, value]) => [el('dt', {}, name), el('dd', {}, value)])),
    el('div', { id: 'actions' }, actionsView(request)),
    el('h3', {}, 'History'),
    // As returned: the service orders it newest first, so the page does not sort.
    el('ol', {}, history.map(historyEntry)),
  ];
}

// What the page offers, worked out from what the service returned. This is a
// presentation of rules the service enforces itself -- a reviewer may not decide
// what they raised, only the requester may amend or withdraw -- so the page
// adds no rule of its own, and the service still decides every attempt and is
// heard when it refuses one. Role decides the kind of action; ownership and
// status decide whether it is worth offering.
function offered(request) {
  const pending = request.status === 'PENDING';
  const mine = request.requestedBy === identity.id;
  const requester = pending && mine && identity.role === 'RELATIONSHIP_MANAGER';
  return {
    decide: pending && !mine && identity.role === 'REVIEWER',
    amend: requester,
    withdraw: requester,
  };
}

function actionsView(request) {
  const allowed = offered(request);
  return [
    allowed.decide && decisionPanel(request),
    allowed.amend && amendForm(request),
    allowed.withdraw && withdrawForm(),
  ].filter(Boolean);
}

function decisionPanel(request) {
  return el('form', { novalidate: true, onsubmit: decide },
    el('h3', {}, 'Decision'),
    // The visible form of a decision binding to an exact version.
    el('p', {}, 'This decision is recorded against version ' + request.version + '.'),
    el('label', {}, 'Note (optional)', el('textarea', { name: 'note', rows: '3' })),
    el('button', { type: 'submit', value: 'APPROVE' }, 'Approve'),
    el('button', { type: 'submit', value: 'DECLINE' }, 'Decline'));
}

async function decide(event) {
  event.preventDefault();
  const form = event.target;
  // The version is read from what is on show, never from a fresher source, so a
  // request that moved on since it was opened is refused rather than decided.
  const body = { decision: event.submitter.value, version: shown.request.version };
  if (form.elements.note.value !== '') body.note = form.elements.note.value;
  await act(form, () => call('POST', '/requests/' + shown.request.id + '/decision', body));
}

function amendForm(request) {
  return el('form', { novalidate: true, onsubmit: amend },
    el('h3', {}, 'Amend'),
    el('p', {}, 'This amendment is made to version ' + request.version + '.'),
    el('label', {}, 'Discount in basis points',
      el('input', { type: 'number', name: 'discountBps', value: request.discountBps })),
    el('label', {}, 'Reason', el('textarea', { name: 'reason', rows: '3' }, request.reason)),
    el('button', { type: 'submit' }, 'Amend'));
}

async function amend(event) {
  event.preventDefault();
  const form = event.target;
  const current = shown.request;
  // The displayed version, so two open windows cannot silently overwrite each
  // other, and only the fields that differ from what is displayed: an amendment
  // that changes nothing is then the service's to refuse, not a version bump
  // that alters nothing yet invalidates a decision under review.
  const body = { version: current.version };
  const discount = form.elements.discountBps.value;
  if (discount !== '' && discount !== String(current.discountBps)) body.discountBps = Number(discount);
  if (form.elements.reason.value !== current.reason) body.reason = form.elements.reason.value;
  await act(form, () => call('PATCH', '/requests/' + current.id, body));
}

function withdrawForm() {
  return el('form', { novalidate: true, onsubmit: withdraw },
    el('h3', {}, 'Withdraw'),
    el('button', { type: 'submit' }, 'Withdraw this request'));
}

async function withdraw(event) {
  event.preventDefault();
  await act(event.target, () => call('POST', '/requests/' + shown.request.id + '/withdrawal',
    { version: shown.request.version }));
}

// Runs a write; on success re-reads the request so the values and the history on
// screen come from one response, on failure leaves the form as typed and says
// why in the service's words.
async function act(form, write) {
  const id = shown.request.id;
  for (const button of form.querySelectorAll('button')) button.disabled = true;
  const result = await write();
  if (result.ok) {
    clearNotice();
    await showDetail(id);
    return;
  }
  for (const button of form.querySelectorAll('button')) button.disabled = false;
  if (result.status === 409) explainConflict(result, id);
  else showProblem(result);
}

// A 409 from a version-bound action means the request moved on while it was
// open, which is the design working rather than a fault. The service's title,
// detail and current version are shown as sent; the sentences around them are
// only framing and never replace what the service said. Without a current
// version to report -- a conflict with no state behind it -- the detail stands
// alone rather than naming a version the page does not have.
function explainConflict(result, id) {
  const problem = result.body || {};
  const now = problem.currentVersion != null
    ? ' It is now at version ' + problem.currentVersion + ', status ' + problem.currentStatus + '.'
    : '';
  notice.replaceChildren(el('article', {},
    el('h3', {}, problem.title),
    el('p', {}, 'This request changed while you had it open.' + now),
    el('p', {}, problem.detail),
    el('button', { type: 'button', onclick: () => { clearNotice(); showDetail(id); } },
      'Reload and review it again')));
}

// What an entry carried: the discount and reason for a creation or amendment
// (an amendment only the fields it changed), the note for a decision.
function historyEntry(entry) {
  const carried = entry.payload || {};
  const lines = [];
  if (carried.discountBps != null) lines.push('Discount: ' + fmtDiscount(carried.discountBps));
  if (carried.reason != null) lines.push('Reason: ' + carried.reason);
  if (carried.note != null) lines.push('Note: ' + carried.note);
  return el('li', {},
    el('strong', {}, entry.entryType),
    ' — version ' + entry.version + ' — ' + entry.actor + ' — ' + fmtTime(entry.occurredAt),
    lines.map((line) => el('div', {}, el('small', {}, line))));
}

// The fragment holds the request id while a detail is open, so a request can be
// linked to and reached directly, and the back button returns to the queue.
function route() {
  clearNotice();
  const target = location.hash.slice(1);
  if (target === 'new') {
    navigation++;
    show('create');
  } else if (target) {
    showDetail(target);
  } else {
    showQueue();
  }
}

window.addEventListener('hashchange', route);
// Following "Queue" from the queue would only append an empty fragment, which
// fires a hashchange of its own; reading the queue here and stopping the
// navigation gives one read and leaves the address clean.
document.getElementById('to-queue').addEventListener('click', (event) => {
  if (!location.hash) {
    event.preventDefault();
    route();
  }
});

const userIdField = document.getElementById('user-id');
const roleField = document.getElementById('role');
userIdField.value = identity.id;
roleField.value = identity.role;

// Enter in the user field would otherwise submit the form and reload the page.
document.getElementById('identity').addEventListener('submit', (event) => event.preventDefault());
document.getElementById('identity').addEventListener('change', () => {
  identity = { id: userIdField.value, role: roleField.value };
  saveIdentity();
  route();
});

route();
</script>
</body>
</html>
