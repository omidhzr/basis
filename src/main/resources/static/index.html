<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basis</title>
<!-- An empty inline icon, so the browser does not ask the service for a favicon it lacks. -->
<link rel="icon" href="data:,">
<!-- Vendored, not loaded from a CDN: the page must render with no network. -->
<link rel="stylesheet" href="vendor/pico.classless.min.css">
</head>
<body>

<header>
  <h1>Basis</h1>
  <nav>
    <ul>
      <li><a href="#" id="to-queue">Queue</a></li>
      <li><a href="#new">New request</a></li>
    </ul>
  </nav>

  <!-- Stands in for the claims a JWT would carry. Switching it is how the
       workflow is demonstrated: the queue changes, not just the buttons. -->
  <form id="identity" novalidate>
    <fieldset role="group">
      <input id="user-id" list="known-users" aria-label="User identifier" autocomplete="off">
      <select id="role" aria-label="Role">
        <option value="RELATIONSHIP_MANAGER">RELATIONSHIP_MANAGER</option>
        <option value="REVIEWER">REVIEWER</option>
      </select>
    </fieldset>
    <datalist id="known-users">
      <option value="rm-1"></option>
      <option value="rm-2"></option>
      <option value="reviewer-1"></option>
      <option value="reviewer-2"></option>
    </datalist>
  </form>
</header>

<main>
  <div id="notice" role="alert"></div>

  <section id="queue" hidden>
    <h2>Queue</h2>
  </section>

  <section id="detail" hidden>
  </section>

  <section id="create" hidden>
    <h2>New request</h2>
  </section>
</main>

<script>
'use strict';

// This page is a thin client over the JSON API. It holds no business rule the
// API does not also enforce: every bound, every transition and every refusal
// comes from the service, and what the service says is what is shown.

// Builds an element from data without any path that parses markup. Every value
// a user wrote -- a reason, a note, an identity -- reaches the page through a
// text node, so none of it can become script.
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [name, value] of Object.entries(attrs || {})) {
    if (name.startsWith('on')) node.addEventListener(name.slice(2), value);
    else if (value === true) node.setAttribute(name, '');
    else if (value !== false && value != null) node.setAttribute(name, value);
  }
  for (const child of children.flat()) {
    node.append(child instanceof Node ? child : String(child ?? ''));
  }
  return node;
}

// Identity is a stand-in for the claims a JWT would carry; nothing verifies it.
// It travels as headers on every call, from one place, so no call can forget it.
// Kept per tab, not per browser, so two tabs can be two different people -- which
// is how a stale decision is shown to someone -- and tolerant of storage being
// refused, in which case the default is simply not remembered.
const DEFAULT_IDENTITY = { id: 'rm-1', role: 'RELATIONSHIP_MANAGER' };

function loadIdentity() {
  try {
    const stored = JSON.parse(sessionStorage.getItem('identity'));
    if (stored && typeof stored.id === 'string' && ['RELATIONSHIP_MANAGER', 'REVIEWER'].includes(stored.role)) {
      return stored;
    }
  } catch { /* storage refused or unreadable: fall through to the default */ }
  return { ...DEFAULT_IDENTITY };
}

function saveIdentity() {
  try { sessionStorage.setItem('identity', JSON.stringify(identity)); } catch { /* not remembered */ }
}

let identity = loadIdentity();

// Never throws: a call that fails before any response exists comes back with
// status 0 and the browser's own message, since there is no problem detail to
// show and inventing wording is what this page must not do.
async function call(method, path, body, extraHeaders) {
  const headers = { 'X-User-Id': identity.id, 'X-User-Role': identity.role, ...extraHeaders };
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  try {
    const response = await fetch(path, {
      method,
      headers,
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    const text = await response.text();
    let parsed = null;
    try { parsed = text ? JSON.parse(text) : null; } catch { /* not JSON */ }
    return { ok: response.ok, status: response.status, statusText: response.statusText, body: parsed };
  } catch (failure) {
    return { ok: false, status: 0, failure: failure.message };
  }
}

const notice = document.getElementById('notice');

function clearNotice() {
  notice.replaceChildren();
}

// The one place a refusal is rendered: the service's title and detail, as sent.
function showProblem(result) {
  if (result.failure !== undefined) {
    notice.replaceChildren(el('article', {}, el('p', {}, result.failure)));
    return;
  }
  const problem = result.body;
  if (problem && (problem.title || problem.detail)) {
    notice.replaceChildren(el('article', {},
      el('h3', {}, problem.title),
      el('p', {}, problem.detail),
      el('small', {}, 'HTTP ' + result.status)));
  } else {
    notice.replaceChildren(el('article', {}, el('p', {}, result.status + ' ' + result.statusText)));
  }
}

// One section is shown at a time, toggled by state rather than routed.
function show(name) {
  for (const id of ['queue', 'detail', 'create']) {
    document.getElementById(id).hidden = id !== name;
  }
}

// Instants arrive as UTC ISO-8601. Reformatting the string, rather than building
// a Date, keeps the page from converting to the viewer's zone, which would make
// one history read differently on two machines.
function fmtTime(instant) {
  return instant ? instant.slice(0, 10) + ' ' + instant.slice(11, 16) + ' UTC' : '';
}

// Whole hundredths, not floating-point division: the stored value is an integer
// and its rendering should not be a float either.
function fmtDiscount(bps) {
  return bps + ' bp (' + Math.floor(bps / 100) + '.' + String(bps % 100).padStart(2, '0') + ' percentage points)';
}

// A navigation that has been overtaken -- the identity switched, a link followed
// -- must not paint over the one that replaced it when its response arrives late.
let navigation = 0;

async function showQueue() {
  const mine = ++navigation;
  show('queue');
  const result = await call('GET', '/requests');
  if (mine !== navigation) return;
  const section = document.getElementById('queue');
  const heading = section.querySelector('h2');
  if (!result.ok) {
    showProblem(result);
    section.replaceChildren(heading);
    return;
  }
  section.replaceChildren(heading, queueTable(result.body));
}

function queueTable(rows) {
  if (rows.length === 0) return el('p', {}, 'Nothing to show.');
  const columns = ['Application', 'Discount', 'Reason', 'Requested by', 'Status', 'Submitted', 'Version'];
  return el('table', {},
    el('thead', {}, el('tr', {}, columns.map((name) => el('th', { scope: 'col' }, name)))),
    el('tbody', {}, rows.map((row) => el('tr', {},
      el('td', {}, el('a', { href: '#' + row.id }, row.applicationId)),
      el('td', {}, fmtDiscount(row.discountBps)),
      el('td', {}, row.reason),
      el('td', {}, row.requestedBy),
      el('td', {}, row.status),
      el('td', {}, fmtTime(row.createdAt)),
      el('td', {}, row.version)))));
}

function route() {
  clearNotice();
  showQueue();
}

const userIdField = document.getElementById('user-id');
const roleField = document.getElementById('role');
userIdField.value = identity.id;
roleField.value = identity.role;

// Enter in the user field would otherwise submit the form and reload the page.
document.getElementById('identity').addEventListener('submit', (event) => event.preventDefault());
document.getElementById('identity').addEventListener('change', () => {
  identity = { id: userIdField.value, role: roleField.value };
  saveIdentity();
  route();
});

route();
</script>
</body>
</html>
